# No chaseflow deploy pattern exists in this repo (no fly.toml anywhere
# at the time of writing), so this is a minimal standalone Fly config
# for the l33tsaas Node service (listens on $PORT, default 8080).
app = "spl-l33tsaas"

# Change to your nearest region before first deploy (fly regions list).
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
